type: tools
spec:
  enable_mock_tools: true
  enable_internal_tools: true
  enable_mcp_tools: false
  mcp:
    enabled: false
    host: localhost
    port: 8888
    apiKey: ""  # Optional API Key for MCP authentication
  mcp_timeout: 30
  mcp_max_retries: 3
